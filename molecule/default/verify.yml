---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: Gather service state
      ansible.builtin.service_facts:

    - name: Verify the agent is installed and running
      ansible.builtin.assert:
        that:
          - "'datadog-agent' in ansible_facts.packages"
          - "ansible_facts.services['datadog-agent.service'].state == 'running'"

    - name: Inspect Debian repository files
      ansible.builtin.stat:
        path: "/etc/apt/sources.list.d/{{ item }}"
      loop:
        - apt_datadoghq_com.list
        - ansible_datadog_7.list
        - ansible_datadog_7.sources
      register: datadog_repository_files
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify legacy sources were replaced by the deb822 source
      ansible.builtin.assert:
        that:
          - not datadog_repository_files.results[0].stat.exists
          - not datadog_repository_files.results[1].stat.exists
          - datadog_repository_files.results[2].stat.exists
      when: ansible_facts['os_family'] == 'Debian'

    - name: Read the deb822 source
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/ansible_datadog_7.sources
      register: datadog_repository_source
      when: ansible_facts['os_family'] == 'Debian'

    - name: Verify the deb822 source points to Agent 7
      ansible.builtin.assert:
        that:
          - "'https://apt.datadoghq.com/' in (datadog_repository_source.content | b64decode)"
          - "'Suites: stable' in (datadog_repository_source.content | b64decode)"
          - "'Components: 7' in (datadog_repository_source.content | b64decode)"
      when: ansible_facts['os_family'] == 'Debian'
